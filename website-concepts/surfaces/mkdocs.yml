site_name: EasyDiffraction
site_description: Diffraction analysis, your way. Application, Python and command line in one place.
site_url: http://127.0.0.1:8873/
docs_dir: docs
site_dir: site
theme:
  variant: modern
  custom_dir: overrides
  logo: assets/logo-light.svg
  favicon: assets/icon.png
  palette:
    - scheme: default
      primary: light blue
      accent: light blue
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - scheme: slate
      primary: light blue
      accent: light blue
      toggle:
        icon: lucide/moon
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - toc.follow
    - content.code.copy
extra_css:
  - assets/wordmark.css
nav:
- Home: index.md
- User guide:
  - user-guide/index.md
  - Foundations:
    - Introduction: user-guide/introduction.md
    - Concept: user-guide/concepts.md
    - Data formats: user-guide/data-formats.md
    - Parameters: user-guide/parameters.md
    - Glossary: user-guide/glossary.md
  - Analysis workflow:
    - user-guide/analysis-workflow/index.md
    - Project: user-guide/analysis-workflow/project.md
    - Structure: user-guide/analysis-workflow/structure.md
    - Experiment: user-guide/analysis-workflow/experiment.md
    - Analysis: user-guide/analysis-workflow/analysis.md
    - Fitting modes: user-guide/fitting-modes.md
    - Fit quality: user-guide/fit-quality.md
    - Report: user-guide/analysis-workflow/report.md
  - Examples: user-guide/examples.md
- Application:
  - application/index.md
  - Start here:
    - In your browser: application/browser.md
    - On your desktop: application/desktop.md
    - First refinement: application/first-refinement.md
    - The workspace: application/workspace.md
    - Example projects: application/examples.md
  - Project:
    - Create a project: application/new-project.md
    - Open and save: application/projects.md
  - Structure:
    - Edit structures: application/structures.md
  - Experiment:
    - Experiments and data: application/experiments.md
    - Background and exclusions: application/background.md
  - Analysis:
    - Refine a pattern: application/refine.md
    - Fitting modes: application/fitting-modes.md
    - Work with a scan: application/scans.md
  - Report:
    - Review and save: application/reports.md
- Python:
  - python/index.md
  - Start here:
    - Setup: python/setup.md
    - First refinement: python/examples.md
  - Project:
    - Load and save: python/projects.md
  - Structure:
    - Structures and parameters: python/structures.md
  - Experiment:
    - Experiments and data: python/experiments.md
  - Analysis:
    - Calculate a pattern: python/calculate.md
    - Fit a project: python/fit.md
    - Inspect results: python/results.md
  - Report:
    - Generate and save: python/reports.md
  - Reference:
    - API quick reference: python/reference.md
- Command Line:
  - cli/index.md
  - Start here:
    - Setup: cli/setup.md
    - First refinement: cli/examples.md
  - Project:
    - Inputs and output files: cli/files.md
  - Structure:
    - Prepared structures: cli/structures.md
  - Experiment:
    - Prepared experiments: cli/experiments.md
  - Analysis:
    - Calculate a pattern: cli/calculate.md
    - Refine a project: cli/fit.md
    - Batch workflows: cli/batch.md
  - Report:
    - Generate and check: cli/reports.md
  - Reference:
    - Command reference: cli/reference.md
- Physics:
  - physics/index.md
  - Diffraction and scattering: physics/diffraction.md
  - Peak profiles: physics/profiles.md
  - Refinement and statistics: physics/refinement.md
  - Conventions: physics/conventions.md
- About:
  - about/index.md
  - Get involved: about/community.md
  - Licence and source: about/licence.md
  - Citation and reproducibility: about/citation.md
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
copyright: 'EasyDiffraction · <a href="https://enhantica.github.io/edi/dev/">Contributor documentation</a>'
validation:
  invalid_links: true
  invalid_link_anchors: true
